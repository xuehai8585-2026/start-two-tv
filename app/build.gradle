plugins {
    id 'com.android.application'
}

android {
    namespace 'com.starttwo.tvfilemanager'
    compileSdk 33

    defaultConfig {
        applicationId "com.starttwo.tvfilemanager"
        minSdk 26
        targetSdk 28
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
}
